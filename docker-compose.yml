version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: hxai-postgres
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: hxai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - hxai-network

  redis:
    image: redis:7-alpine
    container_name: hxai-redis
    ports:
      - "6379:6379"
    networks:
      - hxai-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hxai-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/hxai_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: your-secret-key-change-this
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    networks:
      - hxai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hxai-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    networks:
      - hxai-network

volumes:
  postgres_data:

networks:
  hxai-network:
    driver: bridge
